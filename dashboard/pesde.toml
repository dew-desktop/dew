name = "dew/dashboard"
version = "0.0.1"

# NO LONGER FRAMEWORK-FREE, as of the tab bar's own migration onto
# `Aether.Tabs`. `Instance.new`, property assignment and `Parent` still build
# the rest of the tree by hand; Aether owns exactly one thing here, which tab
# is active and how a click or a keyboard press changes it.
#
# PINNED FOR `TextInput`'s `Masked` prop, which the password field uses.
# `vide` is pinned to the rev aether's own `pesde.toml` declares as its
# `vide` peer dependency. pesde resolves a peer against the consumer's own
# declared version, so an unmatched pin here would link two vide copies side
# by side, and a source made against one is invisible to an effect on the
# other.
[target]
environment = "roblox"
lib = "dashboard.luau"

[dependencies]
aether = { repo = "project-aether-ui/aether", rev = "d08aae3fe482ccfb9af62f14cf910f612f322068" }
vide = { repo = "es9-dev/vide", rev = "7dca1bb7bad3201d2b4c308fcd82b7d97306cd79" }

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

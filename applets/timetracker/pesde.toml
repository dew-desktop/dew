name = "dew_applets/timetracker"
version = "0.0.1"

# A MOD DECLARES ITS OWN FRAMEWORK. The host used to hand every applet Aether and
# vide through injected aliases, so an applet could not say what it depended on. A
# Roblox place installs its packages and requires them by name; so does this.
[target]
environment = "roblox"
lib = "timetracker.luau"

[dependencies]
aether = { repo = "project-aether-ui/aether", rev = "5c44eb469601bda06e0b366e41c938f718b1cd32" }

# AETHER DECLARES VIDE AS A PEER, so the application chooses the copy. One vide
# per process: two would mean a source made against one graph is invisible to an
# effect on the other.
vide = { repo = "es9-dev/vide", rev = "caa0d6dd42ea882f5e27af379b504eb428014aab" }

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

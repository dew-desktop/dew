# Asks
#
# An applet that asks the host for its surface and returns nothing at all.

id = "asks"
name = "Asks"
description = "An applet that asks for its surface instead of declaring one"

runtime = "datamodel"

# THE GRANT IS WHAT PUTS `dew.widget` ON THE TABLE. Remove this word and the
# call below is a nil index at its own line rather than a refusal somewhere else.
permissions = ["widget"]

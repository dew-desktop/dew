# System Monitor
#
# A detailed, draggable system panel in the desktop clock's colours: CPU load
# with a minute of history and a heat tile per core, memory split by flex
# ratio, a mirrored network waveform, storage, and the busiest processes.

id = "monitor"
name = "System Monitor"
description = "CPU, cores, memory, network, storage and top processes, live"

permissions = ["widget", "storage", "system"]

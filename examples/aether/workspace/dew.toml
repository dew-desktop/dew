# Workspace
#
# Virtual window manager, running inside one Dew window

id = "workspace"
name = "Workspace"
description = "Virtual window manager, running inside one Dew window"

# THIS APPLET MOUNTS ITS OWN FRAMEWORK. It asks the host for a surface, builds
# its tree into it and hands the host nothing to mount on its behalf.

# NO PERMISSIONS BEYOND A SURFACE.
permissions = ["overlay"]

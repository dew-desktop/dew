# Calculator
#
# Quick math widget

id = "calculator"
name = "Calculator"
description = "Quick math widget"

# THIS APPLET MOUNTS ITS OWN FRAMEWORK. It asks the host for a surface, builds
# its tree into it and hands the host nothing to mount on its behalf.
runtime = "datamodel"

# NO PERMISSIONS BEYOND A SURFACE. It does arithmetic on its own state and
# touches nothing else.
permissions = ["widget"]

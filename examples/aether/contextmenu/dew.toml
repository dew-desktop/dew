# Context menu
#
# A menu summoned by a right-click, so `framework-coverage` can prove a press
# lands on the row it was aimed at rather than merely that the surface repainted.

id = "contextmenu"
name = "Context menu"
description = "A context menu opened by a right-click and closed by choosing a row"

# THIS APPLET MOUNTS ITS OWN FRAMEWORK. It asks the host for a surface, builds
# its tree into it and hands the host nothing to mount on its behalf.
runtime = "datamodel"

# NO PERMISSIONS BEYOND A SURFACE. It reads the pointer the host reports and
# touches nothing else.
permissions = ["widget"]

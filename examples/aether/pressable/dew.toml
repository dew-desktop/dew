# Pressable
#
# A pressable that changes colour while pressed, so `framework-coverage` can
# prove the framework responds rather than merely loads.

id = "pressable"
name = "Pressable"
description = "A pressable that changes colour under a press"

# THIS APPLET MOUNTS ITS OWN FRAMEWORK, so the host hands it a root and stays
# out of the way.

# NO PERMISSIONS. It does arithmetic on its own state and touches nothing.
permissions = ["widget"]

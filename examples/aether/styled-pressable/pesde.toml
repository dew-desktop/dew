name = "dew_examples/styled_pressable"
version = "0.0.1"
description = "A Pressable styled through a real StyleSheet cascade, theme swappable live"

# A DEMO INSTALLS ITS OWN FRAMEWORK, per ADR-008, the same as
# examples/aether/pressable already does.
[target]
environment = "roblox"
lib = "styled-pressable.luau"

[dependencies]
aether = { repo = "project-aether-ui/aether", rev = "7c8977171c42d9d4110d18df7b236329baacb796" }
vide = { repo = "es9-dev/vide", rev = "7dca1bb7bad3201d2b4c308fcd82b7d97306cd79" }

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[package]
name = "dew"
version = "0.0.1"
description = "Minimalist Desktop HUD & Luau Tooling Ecosystem"
authors = ["Dew Team"]
edition = "2021"

[lib]
name = "dew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
mlua = { version = "0.12", features = ["luau", "send", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

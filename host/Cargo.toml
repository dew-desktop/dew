[package]
name = "dew-host"
version = "0.1.0"
description = "Dew: the desktop applet platform — mods, capabilities, hotkeys and windows over Aether"
authors = ["Dew Team"]
edition = "2021"

# EVERYTHING THAT DRAWS OR EXECUTES COMES FROM AETHER, and nothing here
# reimplements it. Dew's own code is mod discovery, manifests, capabilities and
# placement; when a rendering change is needed it belongs upstream, where the
# Roblox host gets it too.
#
# PATH DEPENDENCIES, and this is bootstrap state. The intended form is a git pin
# on a commit — see aether/docs/graduation_followups.md for the two things that
# have to become true of that repository first. Swap these the day Aether has a
# reachable remote.
[dependencies]
aether_runtime = { path = "../../aether/hosts/runtime", features = ["raster"] }
aether_raster = { path = "../../aether/hosts/raster" }
aether_window = { path = "../../aether/hosts/window" }

mlua = { version = "0.12", features = ["luau", "send", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"

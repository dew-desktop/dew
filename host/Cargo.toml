[package]
name = "dew-host"
version = "0.1.0"
description = "Dew Native Luau Desktop Host with Aether Vello GPU Presentation"
authors = ["Dew Team"]
edition = "2021"

[dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader"
] }
raw-window-handle = "0.6"
mlua = { version = "0.12", features = ["luau", "send", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
chrono = "0.4"
aether_raster = { path = "C:/Users/i0rig/Documents/Development/Roblox/Libraries/Incubator_Spektr/pkgs/ui/hosts/raster", features = ["gpu"] }

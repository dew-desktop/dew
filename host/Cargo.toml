[package]
name = "dew-host"
version = "0.1.0"
description = "Dew: the desktop applet platform — mods, capabilities, hotkeys and windows over its own DataModel"
authors = ["Dew Team"]
edition = "2021"
# PolyForm Shield 1.0.0 -- see ADR-011. `license-file` rather than `license`
# because PolyForm is not an SPDX identifier, and a made-up one would fail
# validation on any tool that checks.
license-file = "../LICENSE"

# `cargo run` with no --bin runs dew. Adding secondary binaries made that
# ambiguous and cargo refused, which is correct of cargo and surprising for
# anyone who had been running the command for weeks.
default-run = "dew"

# EVERYTHING THAT DRAWS OR EXECUTES IS DEW'S, and lives beside this file.
#
# It used to come from Aether by git pin, and the pin's own comment argued the
# case well: a path dependency is "whatever is on that disk right now", and a
# revision is a fact. That argument was right about pinning and wrong about
# whose code it was. ADR-004 measured it -- `pesde.toml` ships `src/**`, so no
# Rust in that repository reaches a Luau consumer, and the only two dependents
# were Dew and aether-cli, both hosts, one retiring. The display list, the
# painter, the rasteriser and the window are Dew's rendering stack, and they now
# live in `crates/` where a path dependency is not a floating pin but the same
# working tree.
#
# WHAT STILL COMES FROM AETHER IS LUAU, and it comes through pesde: see
# `pesde.toml`, where `aether` is pinned by commit exactly as it was here.
[lib]
name = "dew_host"
path = "src/lib.rs"

[[bin]]
name = "dew"
path = "src/main.rs"

[[bin]]
name = "dew-host"
path = "src/bin/dew_host.rs"

# Hyphenated to match, rather than inheriting datamodel_surface from the file
# name. It is a developer tool: it prints what the DataModel Standard has to
# cover and what this stack implements of it.
[[bin]]
name = "datamodel-surface"
path = "src/bin/datamodel_surface.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "generate-datamodel-types"
path = "src/bin/generate_datamodel_types.rs"

[[bin]]
name = "gallery-coverage"
path = "src/bin/gallery_coverage.rs"

[dependencies]
# THE NAMES ARE STILL AETHER'S, AND THAT IS THIS SPRINT REFUSING TO DO TWO
# THINGS AT ONCE. A move and a rename in one diff is a diff nobody can review:
# every line would be touched and none of them would say which change it was.
# The rename is its own commit.
dew_runtime = { path = "../crates/runtime", features = ["raster"] }
dew_raster = { path = "../crates/raster" }
dew_window = { path = "../crates/window" }

# THE DATAMODEL SURFACE, from Roblox's own API dump.
#
# rbx_reflection_database is generated from the dump and versioned against a
# Roblox build, so the class hierarchy, the property list and every default come
# from Roblox rather than from a hand-written list that drifts. It is what lets
# the host reject a property that does not exist on a class before the value
# reaches layout, which is the security argument for a host-owned datamodel made
# concrete.
#
# rbx_types carries UDim2, Color3, Vector2, Rect, Font and the rest with Roblox's
# own semantics. It is the part that would be embarrassing to write again and the
# part where being subtly wrong produces exactly the cross-host divergence the
# standard exists to prevent.
rbx_types = "3"
rbx_reflection = "7"
rbx_reflection_database = "3"

# DECODING AN ASSET IS THE HOST'S JOB, and this is the one line that says so.
#
# `crates/raster` has carried `image` since it was written and uses it for ONE
# thing -- writing a PNG out. It deliberately gains no decoder: a rasteriser that
# decoded assets would be deciding what a `Content` resolves to, which is the
# scheme, the permission and the cache, and all three are the host's. So the host
# turns bytes into pixels and hands the rasteriser pixels.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
# Only for masking password input at `dew login`'s prompt; no protocol or
# crypto role, unlike everything else near it in this file.
rpassword = "7"

mlua = { version = "0.12", features = ["luau", "send", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The applet manifest is `dew.toml`. TOML rather than JSON for one reason:
# comments. Every manifest here is hand-written and this project comments
# everything. See ADR-009.
toml = "0.8"
dirs = "6.0"

# `.dewpkg` IS A ZIP FILE, nothing more. `deflate` is the only compression
# feature enabled -- a manifest and a handful of Luau files never approach the
# case `bzip2` or `zstd` exist for, so there is nothing to gain by linking them.
zip = { version = "2", default-features = false, features = ["deflate"] }

# WIN32, FOR DEW'S OWN FURNITURE. `dew_window` owns what any Aether host needs
# from a platform -- surfaces and input -- and a tray icon is neither. It presents
# nothing of Aether and the CLI will never want one, so the mechanism lives here
# with the product that needs it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    # A SECOND `dew run` HAS TO REACH THE FIRST. `Win32_System_Threading` is the
    # named mutex that says whether a coordinator is already running,
    # `Win32_System_Pipes` and `Win32_Storage_FileSystem` are the named pipe a
    # second invocation hands its applet's directory to it over, and
    # `Win32_System_IO`/`Win32_Security` are what those two signatures reach for
    # even though nothing here names either type directly.
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    # THE MANAGE-APPLETS WINDOW'S OWN CHILD CONTROLS. `Win32_Graphics_Gdi`
    # names nothing rendering -- `COLOR_WINDOW` and `HBRUSH` are what
    # `WNDCLASSW.hbrBackground` needs so the window paints an ordinary white
    # background instead of the artifacts an unset brush leaves behind.
    "Win32_Graphics_Gdi",
    # `session.json` HOLDS A LIVE CREDENTIAL. `CryptProtectData` and
    # `CryptUnprotectData` are DPAPI, scoped to the current Windows user by
    # default with no extra entropy needed, the same mechanism Windows'
    # own Credential Manager uses.
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

# `[profile.dev.package."*"]` MOVED TO THE WORKSPACE ROOT, `../Cargo.toml`.
# Cargo reads profiles only from a root and ignores them in a member, so leaving
# it here would have silently restored the 18fps debug build the note there
# describes.

# EMBEDS dew.ico INTO dew.exe ITSELF. A real downloaded release attaches
# only the .exe (see .github/workflows/ci.yml's `release` job), so a tray
# icon sourced from a file beside it was never actually reachable outside
# a full source checkout; embedding it as a Win32 resource has no
# external file dependency at all. No-op on non-Windows targets.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[[bin]]
name = "upstream-probe"
path = "src/bin/upstream_probe.rs"

[[bin]]
name = "framework-coverage"
path = "src/bin/framework_coverage.rs"

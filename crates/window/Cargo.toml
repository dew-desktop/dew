[package]
name = "dew_window"
version = "0.0.1"
edition = "2021"
description = "A native window and message pump for Aether's off-engine hosts"
license-file = "../../LICENSE"

# NO RASTERISER AND NO LUAU. This crate opens a window, reports input, and blits
# a buffer of bytes. It does not know what produced them, which is what lets the
# CLI's preview and Dew's widgets share it without sharing anything else.
#
# An ordinary `Window` surface presents through `wgpu` (milestone 24, sprint 1)
# rather than GDI, because Dew's ordinary-window rendering path is meant to
# carry over unchanged to Linux and Mac, not be re-derived per platform. A
# `Widget`/`Overlay`/`Popover` surface's per-pixel transparency stays a
# separate, platform-specific mechanism -- `DirectComposition` on Windows --
# because `wgpu`'s own alpha-mode portability across backends is not a solved
# problem upstream (gfx-rs/wgpu#3486, #5661) and `winit` states window
# transparency as unimplemented on Wayland outright. See milestone 24's vision
# overview for the full reasoning.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
wgpu = "29"
raw-window-handle = "0.6"
pollster = "1.0.1"

# CLIPPY DEBT THAT ARRIVED WITH THE CODE, NAMED AND COUNTED. The reasoning is in
# `crates/raster/Cargo.toml`; these are the four this crate contributes, both
# pairs in `win32.rs`.
#
#   unnecessary_cast (2)        `u32 as u32` unpacking an LPARAM.
#   unnecessary_mut_passed (2)  `&mut` handed to something taking `&`.
[lints.clippy]
unnecessary_cast = "allow"
unnecessary_mut_passed = "allow"

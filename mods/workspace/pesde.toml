name = "dew_mods/workspace"
version = "0.0.1"

# A MOD DECLARES ITS OWN FRAMEWORK. The host used to hand every mod Aether and
# vide through injected aliases, so a mod could not say what it depended on. A
# Roblox place installs its packages and requires them by name; so does this.
[target]
environment = "roblox"
lib = "workspace.luau"

[dependencies]
aether = { repo = "project-aether-ui/aether", rev = "e824dc104c44e70c2182f4b604a025885a80f52f" }

# AETHER DECLARES VIDE AS A PEER, so the application chooses the copy. One vide
# per process: two would mean a source made against one graph is invisible to an
# effect on the other.
vide = { repo = "es9-dev/vide", rev = "caa0d6dd42ea882f5e27af379b504eb428014aab" }

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

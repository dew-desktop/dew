<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dew HUD</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Floating Primary HUD Pill -->
  <div id="hud-pill" class="dew-pill-container" data-tauri-drag-region>
    <div id="widgets-container" class="dew-widgets-wrapper" data-tauri-drag-region>
      <!-- Dynamic widgets will be injected here -->
    </div>
  </div>

  <!-- Expandable Command Palette Modal -->
  <div id="palette-modal" class="dew-palette-container hidden">
    <div class="dew-palette-box">
      <div class="dew-palette-input-wrapper">
        <svg class="dew-palette-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="palette-input" type="text" placeholder="Type a task or calculation..." autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>

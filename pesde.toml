name = "dew/app"
version = "0.0.1"
description = "Dew Native Luau Desktop HUD & Applet Ecosystem"

[target]
environment = "roblox"
lib = "scripts/init.luau"

# AETHER, AND WHAT DEW SUPPLIES TO IT.
#
# Aether is a GUEST FRAMEWORK, exactly like vide, and it is installed here rather
# than through Cargo -- it was a Cargo dependency until ADR-004 moved the Rust to
# this repository and left no Aether checkout for `luau_source_root()` to read.
# What does NOT travel in a pinned install is Aether's own `roblox_packages`: it
# is generated, so the package carries the framework and none of its dependencies.
#
# vide is that dependency. Dew installs it here and points `@vide` at it, which
# is the seam VideCore exposes for exactly this. The version is Aether's declared
# range; when Aether widens it, this widens with it.
#
# THE REVISION IS READ BY `pesde install` AND BY NOTHING ELSE AT RUN TIME, so a
# bump is only real once the install has run: `aether_runtime::installed_package`
# finds whatever is on disk under `roblox_packages/.pesde/`, not what this file
# says. A stale checkout is a mod mounting against a framework nobody edited.
[dependencies]
# VIDE COMES FROM A FORK, one patch ahead of upstream.
#
# `centau/vide` guards `typeof`, `Instance`, `Enum`, `Color3` and
# `debug.profilebegin` behind a truthiness check on `game`. None of those names
# IS `game` -- it is the condition they are reached through, tested for
# truthiness alone -- so an environment supplying the real globals and no `game`
# takes a fallback that requires `test/`, which the published artifact does not
# ship. Six of vide's modules then fail to require at all.
#
# centau/vide#89 guards each on what it actually uses. It is a no-op on Roblox,
# where every one of those names is present and both forms take the same branch:
# 122/122 before and after, measured with the Luau 0.679 binary their own
# `unit-test.yml` downloads.
#
# PINNED AHEAD OF THE MERGE, DELIBERATELY. This is the shape the package is
# expected to take, and tracking it now means Dew tests against what it is
# ASKING FOR rather than against what it is working around. If the pull request
# is declined the fork becomes permanent and this line does not change.
#
# WHAT THIS DOES NOT DO YET. `game` is still installed -- `mods.rs::install_gate`,
# `main.rs`, and the test helper. Aether's `VideCore.full()` carries its own
# `if not game` guard, so the global cannot go until that changes and the aether
# pin above moves with it. The chain is written up in
# `.artifacts/project/upstream/vide-gates-on-game.md`.
vide = { repo = "es9-dev/vide", rev = "058c5d5bf3b5098029bf6109c564e13f7598a10b" }
aether = { repo = "project-aether-ui/aether", rev = "3eb4cbbb0975225b000ae89643178e3332ebe967" }

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

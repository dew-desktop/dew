# Dew builds and every applet mounts.
#
# `--snapshot` needs no display, which is what makes an applet loading a testable
# fact rather than something someone notices later. It exercises the whole
# chain: manifest, VM, capabilities, the mod's own Luau, Aether's layout, and the
# rasteriser.

name: CI

# WHAT WINDOWS COSTS, AND WHY THIS FILE IS SHAPED AROUND IT.
#
# `windows-latest` bills at 2x and `ubuntu-latest` at 1x, so a Windows job is the
# expensive thing here and there is exactly one. `build` compiles, tests, mounts
# every applet, and then runs fmt and clippy on the artifacts it already has --
# rather than paying a second Windows machine to install a toolchain and compile
# the same code again.
#
# IF EVERY JOB FAILS IN TWO SECONDS WITH NO LOGS, it is not this file. A job that
# dies before its first step, whose log fetch returns `BlobNotFound`, did not get
# a runner -- which in practice means the Actions minutes are gone. Check billing
# before reading YAML. That happened on 2026-09-13 after a day of cold-cache
# Windows builds, and the shape above is the response to it.
on:
  push:
    branches: [main]
  pull_request:
  # SO A RUN CAN BE ASKED FOR, once minutes are back or a quota window resets,
  # without pushing an empty commit to trigger one.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WHY THESE THREE, MEASURED 2026-09-08 on a run that took 6m20s of `cargo build`
# on Linux against 51s on Windows. The difference was a cold cache, and what a
# cold cache has to build here is expensive for reasons CI does not need.
#
# THE RESULT, same day, critical path across the whole workflow:
#
#     before                        380s   (Linux cold every branch)
#     cold, under the new keys      798s   (one-off: a new key builds from cold)
#     warm                          105s
#
# Per job, warm against before: render 380s -> 50s, build 163s -> 105s,
# clippy 61s -> 63s. The saved cache also shrank 43% (322 MiB -> 184 MiB on
# Linux), which is the debug info and the incremental artifacts below.
#
# READ A COLD NUMBER AS A COLD NUMBER. Changing a cache key -- or racing the
# first save on `main` -- costs one full rebuild, and three of the runs measured
# that day were cold for exactly those reasons rather than for anything the
# workflow does.
#
#   CARGO_INCREMENTAL   Incremental artifacts are never reused across CI runs and
#                       are large, so they cost cache upload time and buy nothing.
#   CARGO_PROFILE_DEV_DEBUG
#                       Debug info is the single biggest contributor to link time
#                       on Windows and to the size of `target/`. Nothing in CI
#                       attaches a debugger. Backtraces still name functions.
#   CARGO_NET_RETRY     A registry blip should cost a retry, not a red build.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_NET_RETRY: 3

jobs:
  # WHAT CHANGED, so a documentation commit does not pay for a GPU build.
  #
  # `47b1b57` touched one Markdown file and one lune script, and paid all three
  # Rust jobs -- about sixteen minutes -- to learn that no Rust had changed.
  #
  # THE FILTER IS NEGATIVE ON PURPOSE. It lists what CANNOT affect the build
  # rather than what can, so a path nobody thought about builds by default. The
  # failure mode of the positive form is a new directory that silently stops
  # being compiled, which is the expensive direction to be wrong in.
  #
  # WRITTEN OUT RATHER THAN DELEGATED to a filter action, because the question
  # "can this gate ever say no" has to be answerable locally. This exact `case`
  # was run against four real commits before it shipped: `47b1b57`, the
  # documentation commit that paid for three Rust jobs, answers false, and the
  # three Rust commits before it answer true. A gate nobody has watched refuse
  # is not known to work.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff below needs both endpoints, and the default shallow
          # checkout has only one of them.
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BASE"; head="$PUSH_HEAD"
          fi

          # EVERY UNCERTAINTY BUILDS. A new branch, a force push and a squashed
          # base all report a base this cannot diff against, and the only safe
          # answer to "I do not know what changed" is "build it".
          if ! changed=$(git diff --name-only "$base" "$head" 2>&1); then
            echo "cannot diff $base..$head, so building everything:"
            echo "$changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|scripts/*) continue ;;
              *.md) continue ;;
            esac
            echo "triggers the Rust jobs: $f"
            code=true
          done <<< "$changed"

          if [ "$code" = false ]; then
            echo "documentation and lune scripts only; the Rust jobs are skipped"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # THE CHECKS THAT NEED NO TOOLCHAIN, in their own job so they cost seconds.
  #
  # These three ran inside the Windows build job, where they took two seconds
  # and started fifty-seven seconds in, behind a toolchain install and a cache
  # restore they do not use. They gate the Rust jobs below rather than running
  # beside them, which keeps the property the note on commitlint describes: a
  # malformed subject line fails in half a minute instead of after a GPU build.
  #
  # THIS JOB HAS NO `if:`. verify_ascii covers documentation, so the one kind of
  # commit that skips every Rust job is exactly the kind this job exists for.
  checks:
    name: commitlint, boundaries and ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint below diffs against the pull request base, and the
          # default shallow checkout does not carry it.
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # FIRST, NOT LAST. This was once the final step of the build job, so a
      # malformed subject line cost a full toolchain install, a pesde install, a
      # cold cargo build and three mod mounts -- about ten minutes -- to find out
      # about. It needs nothing but lune, so it runs the moment lune exists.
      #
      # ON A PULL REQUEST, `HEAD` IS NOT YOUR COMMIT. GitHub checks out a
      # synthetic merge commit whose subject is `Merge <sha> into <sha>`, which
      # no conventional-commit rule describes and which nobody wrote. The
      # script's own exemption covers `Title (#1)`, the subject a MERGED pull
      # request gets, and not this one -- so the first pull request this
      # repository ever ran CI on was rejected for a commit that is not in it.
      #
      # The commits worth validating are the ones the branch ADDS, so on a pull
      # request this checks that range instead. On a push it checks HEAD, which
      # is what the script does by default.
      - name: Validate commit subjects
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "pull request: checking $PR_BASE..$PR_HEAD"
            lune run scripts/commitlint_check.luau "$PR_BASE..$PR_HEAD"
          else
            lune run scripts/commitlint_check.luau
          fi

      # ARCHITECTURE, CHECKED. ADR-004 draws hard lines between Aether, Dew and
      # dew-cli, and a boundary with nothing checking it is a boundary nobody
      # follows -- this repository has found that class five times in one
      # milestone. Lune-only, so it runs beside commitlint before anything is
      # built.
      - run: lune run scripts/verify_boundaries.luau

      # PLAIN ASCII IN DOCUMENTATION. CONTRIBUTING.md names three places --
      # commits, pull requests and documentation. commitlint covers the first,
      # this covers the third, and nothing covered either until six sprint
      # records had drifted. Scoped to Markdown ON PURPOSE: source comments and
      # what Dew prints at runtime are not documentation, and a gate that
      # overreaches gets disabled and takes the real rule with it.
      - run: lune run scripts/verify_ascii.luau

      # THE PULL REQUEST ITSELF, held to the rules its commits are held to.
      #
      # A body is the most read thing this repository produces and was the least
      # checked: commits had a linter and bodies had only a style guide, so the
      # generated-by footer that guide forbids shipped in one anyway, along with
      # references to planning notes that are gitignored and therefore name
      # nothing a reader can open.
      #
      # THROUGH THE ENVIRONMENT, NOT AN ARGUMENT. A title and a body are written
      # by whoever opened the pull request and contain every character a shell
      # treats specially; interpolating them into a `run:` line would execute
      # them.
      - name: The pull request reads like a person wrote it
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: lune run scripts/pr_check.luau

  build:
    name: build and mount every applet
    runs-on: windows-latest
    needs: [changes, checks]
    # PULL REQUESTS ONLY, because a push to `main` is a merge of a pull request
    # that just ran this exact matrix. Running it again bills a second Windows
    # machine to learn what was learned four minutes earlier.
    #
    # The trade, stated: nothing re-checks `main` after a merge. That is
    # acceptable while every change arrives through a pull request, and it is the
    # first thing to revisit if that stops being true.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # THE TOOLCHAIN HAS ONE HOME, rust-toolchain.toml, and this reads it rather
      # than naming a version twice. `@stable` floated six releases ahead of the
      # machine this is developed on, which `-D warnings` turns into a red build
      # nobody can reproduce locally.
      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      # `.`, NOT `host`. THE WORKSPACE ROOT IS THE REPOSITORY ROOT.
      #
      # This said `workspaces: host` from before the rendering stack moved in and
      # the four packages became one workspace (ADR-004, milestone 2 sprint 1).
      # After that move `cargo metadata` reports the target directory as
      # `<repo>/target`, and `host/target` does not exist at all -- so this step
      # restored and saved a directory that was not there, cached the registry
      # alone, reported success in nineteen seconds, and every run recompiled
      # wgpu, vello, mlua and tiny-skia from source.
      #
      # It cost 14m53s of a 16m32s job here, 6m47s of clippy, and 6m34s on Linux.
      # The tell was the cache size: 220 MiB for a dependency tree that occupies
      # 4.9 GB of `target/` locally.
      #
      # If the workspace root ever moves again, this moves with it.
      # `shared-key`, SO A NEW BRANCH DOES NOT BUILD FROM COLD. Without it the
      # cache key includes the JOB NAME and the ref, every branch starts empty,
      # and the first run pays a full build -- 6m20s on Linux, measured.
      #
      # ONE KEY PER JOB, NOT ONE PER PLATFORM. An earlier attempt gave `build` and
      # a separate `fmt and clippy` job the same key because both ran on Windows.
      # They do not produce the same artifacts, so they overwrote each other's
      # cache every run and both stayed cold. Shared ACROSS BRANCHES is the point;
      # shared across jobs was a thrash.
      #
      # That problem is now moot from the other direction: clippy runs INSIDE this
      # job, against the target directory this job already filled, so there is one
      # cache and one save rather than two competing for a key.
      #
      # Caches saved on a branch are only restorable by that branch until `main`
      # has run under the same key, so the win lands on the first push after
      # this merges rather than on this one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ${{ runner.os }}-build

      # LUNE, AND IT WAS MISSING. `Generate the interface surface` below runs a
      # lune script, and this job never installed lune: the step failed with "the
      # term 'lune' is not recognized" on every run, and `continue-on-error`
      # reported that as success. The surface has therefore never been generated
      # here, and every measurement that needs it has been quietly skipping.
      #
      # That step's own comment says a silent zero is the bad outcome and nothing
      # reports one. It was right, and the cause was this rather than a mirror
      # being down.
      - uses: CompeyDev/setup-rokit@v0.1.2

      # THE CONFORMANCE CASES COME FROM AETHER, so CI has to have Aether.
      #
      # `find_cases_dir` looks in the working tree, then at a SIBLING checkout,
      # then at the pesde package. A developer has the sibling and CI had only
      # the package, so the two ran the suite against DIFFERENT Aether revisions
      # and disagreed about the tally -- which is why four assertions were once
      # widened to accept either answer, an assertion that tests neither.
      #
      # Cloning the sibling makes local and CI read one source. The pesde pin
      # stays where it is and keeps doing its own job, which is supplying the
      # framework to mods.
      - name: Fetch sibling aether for the conformance cases
        shell: bash
        run: git clone --depth 1 https://github.com/project-aether-ui/aether.git ../aether

      # PESDE IS NOT IN A ROKIT MANIFEST, and cannot be: its releases carry build
      # metadata in the tag (`v0.7.3+registry.0.2.3`) and rokit will not resolve
      # them. Pinned here to the version this repository is developed against.
      - name: Install pesde
        shell: pwsh
        run: |
          # PWSH, NOT BASH. A bash step writing $HOME/.pesde-bin into
          # GITHUB_PATH writes a POSIX path, which later pwsh steps cannot
          # resolve -- so pesde installed correctly and was still "not
          # recognized" one step later.
          $url = "https://github.com/pesde-pkg/pesde/releases/download/v0.7.3%2Bregistry.0.2.3/pesde-0.7.3-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pesde.zip
          Expand-Archive -Path pesde.zip -DestinationPath "$env:RUNNER_TEMP/pesde" -Force
          "$env:RUNNER_TEMP/pesde" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Aether declares vide and a pinned checkout does not carry it, so the host
      # supplies it. Without this every applet fails to mount with "no installed
      # vide reachable".
      - run: pesde install

      # THE INTERFACE SURFACE IS GENERATED, NOT COMMITTED.
      #
      # It derives from a third party's published data, so the repository does not
      # redistribute it (see NOTICE) -- which means CI has to make it, or the
      # property-coverage measurements have no denominator and skip themselves.
      #
      # NOT FATAL. A third-party mirror being down is not a reason to fail a build:
      # the tests that need it say SKIPPED and the rest of the run still means
      # something. A silent zero would be the bad outcome, and nothing reports one.
      - name: Generate the interface surface
        continue-on-error: true
        run: lune run scripts/fetch_api_surface.luau

      # SAY SO WHEN IT DID NOT WORK. The step above is `continue-on-error`, which
      # GitHub reports as success, so two separate failures hid behind a green
      # tick: lune was not installed in this job at all, and the tracker URL had
      # a space in the middle of it. Neither is fatal to a build and both should
      # be visible, so this annotates rather than exits.
      - name: Say if the interface surface is missing
        if: always()
        shell: bash
        run: |
          if [ -s host/datamodel/api_surface.json ]; then
            echo "interface surface: $(wc -c < host/datamodel/api_surface.json) bytes"
          else
            echo "::warning::No interface surface was generated, so every measurement that needs a denominator will skip. See the step above for why."
          fi

      # EACH MOD INSTALLS ITS OWN FRAMEWORK. `roblox_packages/` is gitignored, so
      # a fresh checkout has manifests and no packages; without this every Aether
      # mod fails to mount with "could not read entry module .../roblox_packages/
      # aether.luau". The host injects nothing any more, so there is no fallback
      # that would quietly cover a missed install.
      - name: Install each applet's own dependencies
        shell: bash
        run: |
          # DEMOS TOO, not just applets. `demos/pressable` brings its own Aether
          # exactly like an applet does, and it was left out of this loop while
          # being `check`ed one step later, so it was validated and never
          # mounted. The smoke script mounts everything it discovers, which is
          # what turned this up.
          for m in applets/*/pesde.toml demos/*/pesde.toml; do
            test -f "$m" || continue
            d=$(dirname "$m")
            (cd "$d" && pesde install)
            test -f "$d/roblox_packages/aether.luau" || {
              echo "$d installed no aether redirect"; exit 1; }
          done

      - run: cargo build --manifest-path host/Cargo.toml

      # `cargo test` compiled ZERO tests until the manifest gained some, and
      # printed `ok. 0 passed` while doing it -- the same sentence a passing suite
      # prints. It runs here so that the moment a test exists, something fails
      # when it breaks.
      #
      # `--workspace`, NOT `--manifest-path host/Cargo.toml`. The narrower form
      # ran the host package alone, so every test in `crates/runtime` and
      # `crates/raster` was absent from CI -- including the pixel test that proves
      # a rounded clip masks its corner, which is the only test that can see it.
      #
      # AND A FLOOR, because the suite shrank by 29 without failing. Adding
      # `test = false` to the bin targets left `main.rs`'s tests in the source and
      # stopped cargo building them; the total fell from 346 to 311 and every run
      # stayed green, because a smaller green number reads exactly like a pass.
      # Raise the floor when the suite grows; lowering it has to be a deliberate
      # line in a diff.
      - name: Test the workspace, and refuse a suite that shrank
        shell: bash
        run: |
          FLOOR=352
          out=$(cargo test --workspace 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          total=$(echo "$out" | awk '/^test result:/ {p += $4} END {print p+0}')
          echo "ran $total test(s), floor is $FLOOR"
          test "$total" -ge "$FLOOR" || {
            echo "THE SUITE SHRANK: $total ran, at least $FLOOR expected."
            echo "If tests were deliberately removed, lower the floor in this file"
            echo "in the same commit, so the reduction is visible in the diff."
            exit 1
          }

      # THE CLI CONTRACT, RUN FROM A SCRIPT THIS REPOSITORY OWNS.
      #
      # These invocations used to live here and nowhere else, so nothing but CI
      # ran them and nothing but CI could notice when they went stale. On
      # 2026-09-13 two had: `check applets/*/` relied on the shell expanding a
      # glob, which pwsh does not do for a native executable, and `snapshot
      # --script` passed its output path positionally, which became a second
      # target once applets were named by path. Both were found by a pull request
      # rather than by the change that broke them.
      #
      # `scripts/smoke.luau` is the same file a developer runs before pushing, so
      # local and CI cannot disagree. It does its own directory discovery, which
      # is why there is no glob here for a shell to decline to expand.
      - name: Every command the CLI promises
        run: lune run scripts/smoke.luau --no-build

      # FMT AND CLIPPY HERE RATHER THAN IN A JOB OF THEIR OWN.
      #
      # They had a second windows-latest runner, which meant a second toolchain
      # install, a second cache restore and a second billed machine -- and Windows
      # minutes bill at 2x. Cold, that job's clippy took 424s of billed time to
      # check code this job had already compiled.
      #
      # Running them last, after the build and the mounts, keeps the useful
      # property the separate job had: a formatting complaint does not hide a
      # mount failure, because the mounts have already run.
      - run: cargo fmt --manifest-path host/Cargo.toml --all --check

      - run: cargo clippy --manifest-path host/Cargo.toml --all-targets -- -D warnings

  linux:
    name: build and render without win32
    runs-on: ubuntu-latest
    needs: [changes, checks]
    # PULL REQUESTS ONLY, because a push to `main` is a merge of a pull request
    # that just ran this exact matrix. Running it again bills a second Windows
    # machine to learn what was learned four minutes earlier.
    #
    # The trade, stated: nothing re-checks `main` after a merge. That is
    # acceptable while every change arrives through a pull request, and it is the
    # first thing to revisit if that stops being true.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      # `.`, NOT `host`. See the note in the build job.
      # `shared-key`, SO A NEW BRANCH DOES NOT BUILD FROM COLD. Without it the
      # cache key includes the ref, every branch starts empty, and the first run
      # pays a full build -- 6m20s on Linux, measured. A shared key per platform
      # lets every branch restore what `main` already built.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ${{ runner.os }}-render

      # LUNE, AND IT WAS MISSING. `Generate the interface surface` below runs a
      # lune script, and this job never installed lune: the step failed with "the
      # term 'lune' is not recognized" on every run, and `continue-on-error`
      # reported that as success. The surface has therefore never been generated
      # here, and every measurement that needs it has been quietly skipping.
      #
      # That step's own comment says a silent zero is the bad outcome and nothing
      # reports one. It was right, and the cause was this rather than a mirror
      # being down.
      - uses: CompeyDev/setup-rokit@v0.1.2

      # THE CONFORMANCE CASES COME FROM AETHER, so CI has to have Aether.
      #
      # `find_cases_dir` looks in the working tree, then at a SIBLING checkout,
      # then at the pesde package. A developer has the sibling and CI had only
      # the package, so the two ran the suite against DIFFERENT Aether revisions
      # and disagreed about the tally -- which is why four assertions were once
      # widened to accept either answer, an assertion that tests neither.
      #
      # Cloning the sibling makes local and CI read one source. The pesde pin
      # stays where it is and keeps doing its own job, which is supplying the
      # framework to mods.
      - name: Fetch sibling aether for the conformance cases
        shell: bash
        run: git clone --depth 1 https://github.com/project-aether-ui/aether.git ../aether

      # Install Linux pesde binary
      - name: Install pesde
        shell: bash
        run: |
          url="https://github.com/pesde-pkg/pesde/releases/download/v0.7.3%2Bregistry.0.2.3/pesde-0.7.3-linux-x86_64.zip"
          curl -sSL "$url" -o pesde.zip
          unzip -q pesde.zip -d "$RUNNER_TEMP/pesde"
          chmod +x "$RUNNER_TEMP/pesde/pesde"
          echo "$RUNNER_TEMP/pesde" >> "$GITHUB_PATH"

      - run: pesde install

      # THE INTERFACE SURFACE IS GENERATED, NOT COMMITTED.
      #
      # It derives from a third party's published data, so the repository does not
      # redistribute it (see NOTICE) -- which means CI has to make it, or the
      # property-coverage measurements have no denominator and skip themselves.
      #
      # NOT FATAL. A third-party mirror being down is not a reason to fail a build:
      # the tests that need it say SKIPPED and the rest of the run still means
      # something. A silent zero would be the bad outcome, and nothing reports one.
      - name: Generate the interface surface
        continue-on-error: true
        run: lune run scripts/fetch_api_surface.luau

      # SAY SO WHEN IT DID NOT WORK. The step above is `continue-on-error`, which
      # GitHub reports as success, so two separate failures hid behind a green
      # tick: lune was not installed in this job at all, and the tracker URL had
      # a space in the middle of it. Neither is fatal to a build and both should
      # be visible, so this annotates rather than exits.
      - name: Say if the interface surface is missing
        if: always()
        shell: bash
        run: |
          if [ -s host/datamodel/api_surface.json ]; then
            echo "interface surface: $(wc -c < host/datamodel/api_surface.json) bytes"
          else
            echo "::warning::No interface surface was generated, so every measurement that needs a denominator will skip. See the step above for why."
          fi

      # EACH MOD INSTALLS ITS OWN FRAMEWORK. `roblox_packages/` is gitignored, so
      # a fresh checkout has manifests and no packages; without this every Aether
      # mod fails to mount with "could not read entry module .../roblox_packages/
      # aether.luau". The host injects nothing any more, so there is no fallback
      # that would quietly cover a missed install.
      - name: Install each applet's own dependencies
        shell: bash
        run: |
          # DEMOS TOO, not just applets. `demos/pressable` brings its own Aether
          # exactly like an applet does, and it was left out of this loop while
          # being `check`ed one step later, so it was validated and never
          # mounted. The smoke script mounts everything it discovers, which is
          # what turned this up.
          for m in applets/*/pesde.toml demos/*/pesde.toml; do
            test -f "$m" || continue
            d=$(dirname "$m")
            (cd "$d" && pesde install)
            test -f "$d/roblox_packages/aether.luau" || {
              echo "$d installed no aether redirect"; exit 1; }
          done

      # TWO BINARIES, NOT SIX. This job renders and scaffolds; it never runs the
      # conformance runner, the surface report or the upstream probe, and
      # building them was pure cost on the longest job in the workflow.
      #
      # The Windows job keeps the full build, because `cargo test --workspace`
      # immediately after compiles every target regardless.
      - run: cargo build --manifest-path host/Cargo.toml --bin dew --bin gallery-coverage

      - run: cargo test --workspace

      # THE CLI CONTRACT, RUN FROM A SCRIPT THIS REPOSITORY OWNS.
      #
      # These invocations used to live here and nowhere else, so nothing but CI
      # ran them and nothing but CI could notice when they went stale. On
      # 2026-09-13 two had: `check applets/*/` relied on the shell expanding a
      # glob, which pwsh does not do for a native executable, and `snapshot
      # --script` passed its output path positionally, which became a second
      # target once applets were named by path. Both were found by a pull request
      # rather than by the change that broke them.
      #
      # `scripts/smoke.luau` is the same file a developer runs before pushing, so
      # local and CI cannot disagree. It does its own directory discovery, which
      # is why there is no glob here for a shell to decline to expand.
      - name: Every command the CLI promises
        run: lune run scripts/smoke.luau --no-build

      # THE GALLERY RENDERS, AND SAYS HOW MUCH IT SHOWS.
      #
      # `datamodel-surface` reports what the host ACCEPTS; this reports what
      # anything actually DRAWS, and the gap between them is milestone 5. The
      # render runs here because a gallery of images nobody re-renders is a
      # folder of screenshots that rots -- a scene that stops rendering has to
      # fail a build, or it stops being evidence of anything.
      #
      # The coverage number is printed rather than gated. Gating it on a
      # threshold would make the honest early figure a build failure; the number
      # moving is a sprint's job to report, not CI's to enforce.
      - name: Render the gallery and report coverage
        shell: bash
        run: |
          cargo run --quiet --manifest-path host/Cargo.toml --bin gallery-coverage --             --render "$RUNNER_TEMP/gallery" --scenes
          # `find`, NOT `ls *.png`. Renders are nested one level by pillar, and a
          # flat glob silently found nothing the moment the scenes were grouped
          # -- which would have counted zero and failed for the wrong reason.
          count=$(find "$RUNNER_TEMP/gallery" -name '*.png' | wc -l)
          test "$count" -gt 0 || { echo "the gallery rendered no images"; exit 1; }
          echo "gallery rendered $count image(s)"

      # NO STEP FOR `--snapshot` WITHOUT A TARGET, and none for a default applet.
      # Both used to work because the host picked an applet for you. Selecting an
      # applet by path removed the thing they were selecting, so the commands are
      # not broken, they are gone. `snapshot applets/nameplate` above covers what
      # they were really testing, which is that a named applet renders headlessly.

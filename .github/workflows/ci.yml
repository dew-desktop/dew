# Dew builds and every mod mounts.
#
# `--snapshot` needs no display, which is what makes a mod loading a testable
# fact rather than something someone notices later. It exercises the whole
# chain: manifest, VM, capabilities, the mod's own Luau, Aether's layout, and the
# rasteriser.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and mount every mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # THE TOOLCHAIN HAS ONE HOME, rust-toolchain.toml, and this reads it rather
      # than naming a version twice. `@stable` floated six releases ahead of the
      # machine this is developed on, which `-D warnings` turns into a red build
      # nobody can reproduce locally.
      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # FIRST, NOT LAST. This was the final step of the job, so a malformed
      # subject line cost a full toolchain install, a pesde install, a cold cargo
      # build and three mod mounts -- about ten minutes -- to find out about. It
      # needs nothing but lune, so it runs the moment lune exists.
      - run: lune run scripts/commitlint_check.luau

      # ARCHITECTURE, CHECKED. ADR-004 draws hard lines between Aether, Dew and
      # dew-cli, and a boundary with nothing checking it is a boundary nobody
      # follows -- this repository has found that class five times in one
      # milestone. Lune-only, so it runs beside commitlint before anything is
      # built.
      - run: lune run scripts/verify_boundaries.luau

      # PESDE IS NOT IN A ROKIT MANIFEST, and cannot be: its releases carry build
      # metadata in the tag (`v0.7.3+registry.0.2.3`) and rokit will not resolve
      # them. Pinned here to the version this repository is developed against.
      - name: Install pesde
        shell: pwsh
        run: |
          # PWSH, NOT BASH. A bash step writing $HOME/.pesde-bin into
          # GITHUB_PATH writes a POSIX path, which later pwsh steps cannot
          # resolve -- so pesde installed correctly and was still "not
          # recognized" one step later.
          $url = "https://github.com/pesde-pkg/pesde/releases/download/v0.7.3%2Bregistry.0.2.3/pesde-0.7.3-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pesde.zip
          Expand-Archive -Path pesde.zip -DestinationPath "$env:RUNNER_TEMP/pesde" -Force
          "$env:RUNNER_TEMP/pesde" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Aether declares vide and a pinned checkout does not carry it, so the host
      # supplies it. Without this every mod fails to mount with "no installed
      # vide reachable".
      - run: pesde install

      - run: cargo build --manifest-path host/Cargo.toml

      # `cargo test` compiled ZERO tests until the manifest gained some, and
      # printed `ok. 0 passed` while doing it -- the same sentence a passing suite
      # prints. It runs here so that the moment a test exists, something fails
      # when it breaks.
      - run: cargo test --manifest-path host/Cargo.toml

      # EVERY MOD, not the first one. A mod that fails to load is skipped with a
      # message and the host carries on, which is right at runtime and would hide
      # a broken mod here.
      - name: Mount each mod
        shell: bash
        run: |
          for m in mods/*/; do
            id=$(basename "$m")
            echo "--- $id"
            cargo run --quiet --manifest-path host/Cargo.toml -- --mod "$id" --snapshot "/tmp/$id.png"
          done


  format:
    name: fmt and clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # THE TOOLCHAIN HAS ONE HOME, rust-toolchain.toml, and this reads it rather
      # than naming a version twice. `@stable` floated six releases ahead of the
      # machine this is developed on, which `-D warnings` turns into a red build
      # nobody can reproduce locally.
      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - run: cargo fmt --manifest-path host/Cargo.toml --all --check

      # `-D warnings` OR THIS STEP IS DECORATION. clippy exits 0 with warnings on
      # stdout, so without it the job is green whether the code is clean or not --
      # and a lint nobody fails is a lint nobody fixes.
      #
      # --all-targets covers the test builds too. The tray's `WM_COMMAND` cast was
      # only reported there.
      - run: cargo clippy --manifest-path host/Cargo.toml --all-targets -- -D warnings

# Dew builds and every mod mounts.
#
# `--snapshot` needs no display, which is what makes a mod loading a testable
# fact rather than something someone notices later. It exercises the whole
# chain: manifest, VM, capabilities, the mod's own Luau, Aether's layout, and the
# rasteriser.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHAT CHANGED, so a documentation commit does not pay for a GPU build.
  #
  # `47b1b57` touched one Markdown file and one lune script, and paid all three
  # Rust jobs -- about sixteen minutes -- to learn that no Rust had changed.
  #
  # THE FILTER IS NEGATIVE ON PURPOSE. It lists what CANNOT affect the build
  # rather than what can, so a path nobody thought about builds by default. The
  # failure mode of the positive form is a new directory that silently stops
  # being compiled, which is the expensive direction to be wrong in.
  #
  # WRITTEN OUT RATHER THAN DELEGATED to a filter action, because the question
  # "can this gate ever say no" has to be answerable locally. This exact `case`
  # was run against four real commits before it shipped: `47b1b57`, the
  # documentation commit that paid for three Rust jobs, answers false, and the
  # three Rust commits before it answer true. A gate nobody has watched refuse
  # is not known to work.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff below needs both endpoints, and the default shallow
          # checkout has only one of them.
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BASE"; head="$PUSH_HEAD"
          fi

          # EVERY UNCERTAINTY BUILDS. A new branch, a force push and a squashed
          # base all report a base this cannot diff against, and the only safe
          # answer to "I do not know what changed" is "build it".
          if ! changed=$(git diff --name-only "$base" "$head" 2>&1); then
            echo "cannot diff $base..$head, so building everything:"
            echo "$changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|scripts/*) continue ;;
              *.md) continue ;;
            esac
            echo "triggers the Rust jobs: $f"
            code=true
          done <<< "$changed"

          if [ "$code" = false ]; then
            echo "documentation and lune scripts only; the Rust jobs are skipped"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # THE CHECKS THAT NEED NO TOOLCHAIN, in their own job so they cost seconds.
  #
  # These three ran inside the Windows build job, where they took two seconds
  # and started fifty-seven seconds in, behind a toolchain install and a cache
  # restore they do not use. They gate the Rust jobs below rather than running
  # beside them, which keeps the property the note on commitlint describes: a
  # malformed subject line fails in half a minute instead of after a GPU build.
  #
  # THIS JOB HAS NO `if:`. verify_ascii covers documentation, so the one kind of
  # commit that skips every Rust job is exactly the kind this job exists for.
  checks:
    name: commitlint, boundaries and ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint below diffs against the pull request base, and the
          # default shallow checkout does not carry it.
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # FIRST, NOT LAST. This was once the final step of the build job, so a
      # malformed subject line cost a full toolchain install, a pesde install, a
      # cold cargo build and three mod mounts -- about ten minutes -- to find out
      # about. It needs nothing but lune, so it runs the moment lune exists.
      #
      # ON A PULL REQUEST, `HEAD` IS NOT YOUR COMMIT. GitHub checks out a
      # synthetic merge commit whose subject is `Merge <sha> into <sha>`, which
      # no conventional-commit rule describes and which nobody wrote. The
      # script's own exemption covers `Title (#1)`, the subject a MERGED pull
      # request gets, and not this one -- so the first pull request this
      # repository ever ran CI on was rejected for a commit that is not in it.
      #
      # The commits worth validating are the ones the branch ADDS, so on a pull
      # request this checks that range instead. On a push it checks HEAD, which
      # is what the script does by default.
      - name: Validate commit subjects
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "pull request: checking $PR_BASE..$PR_HEAD"
            lune run scripts/commitlint_check.luau "$PR_BASE..$PR_HEAD"
          else
            lune run scripts/commitlint_check.luau
          fi

      # ARCHITECTURE, CHECKED. ADR-004 draws hard lines between Aether, Dew and
      # dew-cli, and a boundary with nothing checking it is a boundary nobody
      # follows -- this repository has found that class five times in one
      # milestone. Lune-only, so it runs beside commitlint before anything is
      # built.
      - run: lune run scripts/verify_boundaries.luau

      # PLAIN ASCII IN DOCUMENTATION. CONTRIBUTING.md names three places --
      # commits, pull requests and documentation. commitlint covers the first,
      # this covers the third, and nothing covered either until six sprint
      # records had drifted. Scoped to Markdown ON PURPOSE: source comments and
      # what Dew prints at runtime are not documentation, and a gate that
      # overreaches gets disabled and takes the real rule with it.
      - run: lune run scripts/verify_ascii.luau

  build:
    name: build and mount every mod
    runs-on: windows-latest
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # THE TOOLCHAIN HAS ONE HOME, rust-toolchain.toml, and this reads it rather
      # than naming a version twice. `@stable` floated six releases ahead of the
      # machine this is developed on, which `-D warnings` turns into a red build
      # nobody can reproduce locally.
      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      # `.`, NOT `host`. THE WORKSPACE ROOT IS THE REPOSITORY ROOT.
      #
      # This said `workspaces: host` from before the rendering stack moved in and
      # the four packages became one workspace (ADR-004, milestone 2 sprint 1).
      # After that move `cargo metadata` reports the target directory as
      # `<repo>/target`, and `host/target` does not exist at all -- so this step
      # restored and saved a directory that was not there, cached the registry
      # alone, reported success in nineteen seconds, and every run recompiled
      # wgpu, vello, mlua and tiny-skia from source.
      #
      # It cost 14m53s of a 16m32s job here, 6m47s of clippy, and 6m34s on Linux.
      # The tell was the cache size: 220 MiB for a dependency tree that occupies
      # 4.9 GB of `target/` locally.
      #
      # If the workspace root ever moves again, this moves with it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # PESDE IS NOT IN A ROKIT MANIFEST, and cannot be: its releases carry build
      # metadata in the tag (`v0.7.3+registry.0.2.3`) and rokit will not resolve
      # them. Pinned here to the version this repository is developed against.
      - name: Install pesde
        shell: pwsh
        run: |
          # PWSH, NOT BASH. A bash step writing $HOME/.pesde-bin into
          # GITHUB_PATH writes a POSIX path, which later pwsh steps cannot
          # resolve -- so pesde installed correctly and was still "not
          # recognized" one step later.
          $url = "https://github.com/pesde-pkg/pesde/releases/download/v0.7.3%2Bregistry.0.2.3/pesde-0.7.3-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pesde.zip
          Expand-Archive -Path pesde.zip -DestinationPath "$env:RUNNER_TEMP/pesde" -Force
          "$env:RUNNER_TEMP/pesde" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Aether declares vide and a pinned checkout does not carry it, so the host
      # supplies it. Without this every mod fails to mount with "no installed
      # vide reachable".
      - run: pesde install

      - run: cargo build --manifest-path host/Cargo.toml

      # `cargo test` compiled ZERO tests until the manifest gained some, and
      # printed `ok. 0 passed` while doing it -- the same sentence a passing suite
      # prints. It runs here so that the moment a test exists, something fails
      # when it breaks.
      - run: cargo test --manifest-path host/Cargo.toml

      # EVERY MOD, not the first one. A mod that fails to load is skipped with a
      # message and the host carries on, which is right at runtime and would hide
      # a broken mod here.
      # Validate all mod manifests and syntax
      - run: cargo run --quiet --manifest-path host/Cargo.toml -- check

      # EVERY MOD, not the first one. A mod that fails to load is skipped with a
      # message and the host carries on, which is right at runtime and would hide
      # a broken mod here.
      - name: Mount each mod
        shell: bash
        run: |
          for m in mods/*/; do
            id=$(basename "$m")
            echo "--- $id"
            cargo run --quiet --manifest-path host/Cargo.toml -- snapshot --mod "$id" "/tmp/$id.png"
          done


  format:
    name: fmt and clippy
    runs-on: windows-latest
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      # THE TOOLCHAIN HAS ONE HOME, rust-toolchain.toml, and this reads it rather
      # than naming a version twice. `@stable` floated six releases ahead of the
      # machine this is developed on, which `-D warnings` turns into a red build
      # nobody can reproduce locally.
      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      # `.`, NOT `host`. See the note in the build job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: cargo fmt --manifest-path host/Cargo.toml --all --check

      # `-D warnings` OR THIS STEP IS DECORATION. clippy exits 0 with warnings on
      # stdout, so without it the job is green whether the code is clean or not --
      # and a lint nobody fails is a lint nobody fixes.
      #
      # --all-targets covers the test builds too. The tray's `WM_COMMAND` cast was
      # only reported there.
      - run: cargo clippy --manifest-path host/Cargo.toml --all-targets -- -D warnings


  linux:
    name: build and render without win32
    runs-on: ubuntu-latest
    needs: [changes, checks]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the toolchain pin
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Rust pinned at $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      # `.`, NOT `host`. See the note in the build job.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Install Linux pesde binary
      - name: Install pesde
        shell: bash
        run: |
          url="https://github.com/pesde-pkg/pesde/releases/download/v0.7.3%2Bregistry.0.2.3/pesde-0.7.3-linux-x86_64.zip"
          curl -sSL "$url" -o pesde.zip
          unzip -q pesde.zip -d "$RUNNER_TEMP/pesde"
          chmod +x "$RUNNER_TEMP/pesde/pesde"
          echo "$RUNNER_TEMP/pesde" >> "$GITHUB_PATH"

      - run: pesde install

      - run: cargo build --manifest-path host/Cargo.toml

      - run: cargo test --manifest-path host/Cargo.toml

      # WINDOW-ONLY COMMANDS AND FLAGS MUST BE REJECTED OFF WINDOWS.
      # `run`, `--stats` and `--bench` drive the window loop and have nothing to run on.
      - name: Assert run, --stats and --bench are rejected off Windows
        shell: bash
        run: |
          for cmd in run --stats --bench; do
            output=$(cargo run --quiet --manifest-path host/Cargo.toml -- "$cmd" 2>&1 || true)
            echo "$output"
            echo "$output" | grep -q "is Windows-only: it drives the window loop; use --snapshot to render headlessly" || {
              echo "Expected $cmd to be rejected as Windows-only, got: $output"
              exit 1
            }
          done

      # VALIDATE MOD MANIFESTS AND LUAU SYNTAX
      - name: Validate mods with check
        shell: bash
        run: |
          cargo run --quiet --manifest-path host/Cargo.toml -- check
          cargo run --quiet --manifest-path host/Cargo.toml -- check nameplate

      # HEADLESS RENDERING: must produce real PNGs without a display.
      - name: Render standalone script snapshot
        shell: bash
        run: |
          cargo run --quiet --manifest-path host/Cargo.toml -- \
            snapshot --script examples/standalone/app.luau --size 360x220 /tmp/standalone.png
          test -s /tmp/standalone.png || { echo "standalone.png was not created or is empty"; exit 1; }
          echo "Rendered /tmp/standalone.png successfully"

      # MOD SELECTION HEADLESS: renders nameplate by name, not whichever sorts first.
      - name: Render named mod snapshot
        shell: bash
        run: |
          output=$(cargo run --quiet --manifest-path host/Cargo.toml -- snapshot --mod nameplate /tmp/nameplate.png)
          echo "$output"
          echo "$output" | grep -q "wrote /tmp/nameplate.png (340x148) for nameplate" || {
            echo "Expected snapshot of nameplate by name, got: $output"
            exit 1
          }
          test -s /tmp/nameplate.png || { echo "nameplate.png was not created or is empty"; exit 1; }
          echo "Rendered /tmp/nameplate.png successfully"

      - name: Render default mod snapshot
        shell: bash
        run: |
          cargo run --quiet --manifest-path host/Cargo.toml -- snapshot /tmp/mod.png
          test -s /tmp/mod.png || { echo "mod.png was not created or is empty"; exit 1; }
          echo "Rendered /tmp/mod.png successfully"

      # MOD SCAFFOLDING WORKFLOW: init, check, and snapshot
      - name: Exercise mod scaffolding
        shell: bash
        run: |
          cargo run --quiet --manifest-path host/Cargo.toml -- init test_scaffold --runtime datamodel
          cargo run --quiet --manifest-path host/Cargo.toml -- check test_scaffold
          cargo run --quiet --manifest-path host/Cargo.toml -- snapshot --mod test_scaffold /tmp/scaffold.png
          test -s /tmp/scaffold.png || { echo "scaffold.png was not created or is empty"; exit 1; }
          rm -rf mods/test_scaffold
          echo "Scaffolded, checked, and rendered test_scaffold mod successfully"

      # BACKWARD COMPATIBILITY: legacy flags without subcommands still work
      - name: Verify legacy flag compatibility
        shell: bash
        run: |
          cargo run --quiet --manifest-path host/Cargo.toml -- --snapshot /tmp/legacy.png
          test -s /tmp/legacy.png || { echo "legacy.png was not created or is empty"; exit 1; }
          echo "Rendered legacy snapshot successfully"
